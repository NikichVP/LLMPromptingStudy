name: Rebuild staged paper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'paper-upload-stage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Rebuild and verify PDF
        shell: bash
        run: |
          cat .paper-upload/chunk*.b64 | base64 --decode > PROMPT_RESEARCH.pdf
          actual="$(git hash-object PROMPT_RESEARCH.pdf)"
          test "$actual" = "4fc627edb318b27786ccdff35a487f36f186de7f"
      - name: Commit paper to staging branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROMPT_RESEARCH.pdf
          git commit -m "Add final research paper" || exit 0
          git push origin HEAD:${{ github.head_ref }}
